
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS AI</title>

<style>
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: #050b14;
  color: #00eaff;
  font-family: Arial, sans-serif;
  text-align: center;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}
.container {
  width: 92%;
  max-width: 450px;
  padding: 25px;
  border: 1px solid #00bfff;
  border-radius: 22px;
  box-shadow: 0 0 25px #007bff55;
}
h1 {
  letter-spacing: 8px;
  text-shadow: 0 0 15px #00eaff;
}
.circle {
  width: 180px;
  height: 180px;
  margin: 30px auto;
  border: 4px solid #00eaff;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 65px;
  box-shadow: 0 0 30px #00eaff;
}
#status {
  color: #8ba9c8;
  min-height: 24px;
}
#response {
  color: white;
  min-height: 55px;
  line-height: 1.5;
}
button {
  background: #00c8ff;
  color: #00101a;
  border: none;
  padding: 15px 22px;
  margin: 8px;
  border-radius: 30px;
  font-weight: bold;
  cursor: pointer;
}
button:active {
  background: white;
}
.small {
  font-size: 12px;
  color: #7795ad;
}
</style>
</head>

<body>
<div class="container">

<h1>J.A.R.V.I.S</h1>
<p>PERSONAL AI ASSISTANT</p>

<div class="circle">◉</div>

<p id="status">SYSTEM ONLINE</p>

<p id="response">
Hello! I am JARVIS. How may I assist you?
</p>

<button onclick="listen()">🎤 TALK TO JARVIS</button>
<button onclick="speak('Hello! How can I help you?')">🔊 SPEAK</button>

<p class="small">IRON MAN PERSONAL ASSISTANT</p>

</div>

<script>
const statusText = document.getElementById("status");
const responseText = document.getElementById("response");

function speak(text) {
  speechSynthesis.cancel();

  const message = new SpeechSynthesisUtterance(text);
  message.lang = "en-US";
  message.rate = 0.95;

  const voices = speechSynthesis.getVoices();
  const maleVoice = voices.find(v =>
    /male|david|mark|james/i.test(v.name)
  );

  if (maleVoice) message.voice = maleVoice;

  speechSynthesis.speak(message);
  responseText.innerText = text;
}

function listen() {
  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    responseText.innerText =
      "Voice recognition is not supported in this browser.";
    return;
  }

  const recognition = new SpeechRecognition();
  recognition.lang = "en-US";
  recognition.start();

  statusText.innerText = "LISTENING...";

  recognition.onresult = function(event) {
    const command =
      event.results[0][0].transcript.toLowerCase();

    statusText.innerText = "PROCESSING...";
    respond(command);
  };

  recognition.onerror = function() {
    statusText.innerText = "VOICE ERROR - TRY AGAIN";
  };

  recognition.onend = function() {
    if (statusText.innerText === "LISTENING...") {
      statusText.innerText = "SYSTEM ONLINE";
    }
  };
}

function respond(command) {
  if (command.includes("hello") ||
      command.includes("hi jarvis")) {
    speak("Hello sir. It is good to hear from you.");
  }

  else if (command.includes("your name")) {
    speak("I am JARVIS, your personal assistant.");
  }

  else if (command.includes("time")) {
    speak("The time is " +
      new Date().toLocaleTimeString());
  }

  else if (command.includes("date")) {
    speak("Today is " +
      new Date().toDateString());
  }

  else if (command.includes("youtube")) {
    speak("Opening YouTube.");
    window.open("https://www.youtube.com", "_blank");
  }

  else if (command.includes("google")) {
    speak("Opening Google.");
    window.open("https://www.google.com", "_blank");
  }

  else if (command.includes("how are you")) {
    speak("All systems are operating normally, sir.");
  }

  else if (command.includes("goodbye")) {
    speak("Goodbye sir. JARVIS standing by.");
  }

  else {
    speak("I heard you say " + command +
      ". I am still learning. Please try another command.");
  }

  statusText.innerText = "SYSTEM ONLINE";
}

</script>
</body>
</html>
